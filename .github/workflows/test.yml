name: Tests

on: [push, pull_request]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install ffmpeg
      # tests/conftest.py generates real tiny silent mp3/m4a/flac fixtures
      # via ffmpeg for the mutagen round-trip tests, rather than mocking -
      # mocking would not have caught the real corruption bug this project
      # found in an earlier tagging approach (ffmpeg -c copy -metadata),
      # since that bug was specific to a file's actual byte structure.
      run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

    - name: Install test dependencies
      run: pip install pytest mutagen

    - name: Run the suite
      run: python3 -m pytest tests/ -v
